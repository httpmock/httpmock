name: Claude Code Review

# pull_request_target so fork PRs get a review too. This runs the workflow as
# defined on master with repository secrets, so it must never check out or
# execute code from the PR. Claude reads the diff through the GitHub API and
# can only run read-only gh commands and post comments.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  claude-review:
    # Runs automatically for maintainers and anyone who has contributed before.
    # PRs from first-time contributors need the claude-review label, which only
    # users with triage access can add. Dependabot PRs don't get the secret.
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (github.event.action != 'labeled' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      # Base branch only (the default for pull_request_target). Don't add a
      # ref to the PR head here.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The job-level if above is the access gate, so the action's own
          # write-access check is relaxed here.
          allowed_non_write_users: '*'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
